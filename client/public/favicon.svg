<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient: Bright Royal Blue to Deep Purple/Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Chat Bubble Gradient with Soft Top-Light -->
    <linearGradient id="bubbleGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF4FF"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>

  <!-- Organic Smooth Chat Bubble Matching Reference Image -->
  <path
    d="M32 17.5C41.8 17.5 48.5 23.2 48.5 29.5C48.5 35.8 41.8 41.5 32 41.5C29.2 41.5 26.6 40.9 24.3 39.8C21.2 42.2 17.4 43.6 15.5 43.8C16.1 41.7 16.9 39.1 17.5 37.1C16.2 34.9 15.5 32.3 15.5 29.5C15.5 23.2 22.2 17.5 32 17.5Z"
    fill="url(#bubbleGrad)"
    filter="url(#bubbleShadow)"
  />
</svg>